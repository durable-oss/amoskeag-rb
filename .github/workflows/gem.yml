name: Build and publish gem

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

jobs:
  # ------------------------------------------------------------------ #
  # Run tests across supported Ruby versions                            #
  # ------------------------------------------------------------------ #
  test:
    name: Test (Ruby ${{ matrix.ruby }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby:
          - "3.1"
          - "3.2"
          - "3.3"
          - "3.4"

    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - uses: dtolnay/rust-toolchain@stable

      - name: Compile extension
        run: bundle exec rake compile

      - name: Run tests
        run: bundle exec rake test

  # ------------------------------------------------------------------ #
  # Cross-compile precompiled native gems (Linux + Windows) via         #
  # rb-sys-dock. Each gem is a fat binary covering every Ruby ABI.      #
  # ------------------------------------------------------------------ #
  native-gems:
    name: Build ${{ matrix.platform }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform:
          - x86_64-linux
          - x86_64-linux-musl
          - aarch64-linux
          - aarch64-linux-musl
          - x64-mingw-ucrt

    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - uses: oxidize-rb/actions/cross-gem@v1
        id: cross-gem
        with:
          platform: ${{ matrix.platform }}
          ruby-versions: "3.1,3.2,3.3,3.4"

      - uses: actions/upload-artifact@v4
        with:
          name: gem-${{ matrix.platform }}
          path: ${{ steps.cross-gem.outputs.gem-path }}

  # ------------------------------------------------------------------ #
  # Build darwin gems natively on macOS runners (no rb-sys-dock images  #
  # exist for darwin, so we compile on the real OS).                    #
  # ------------------------------------------------------------------ #
  native-gems-darwin:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: arm64-darwin
            runner: macos-14
          - platform: x86_64-darwin
            runner: macos-13

    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - uses: dtolnay/rust-toolchain@stable

      - name: Build native gem (${{ matrix.platform }})
        run: bundle exec rake native gem

      - uses: actions/upload-artifact@v4
        with:
          name: gem-${{ matrix.platform }}
          path: pkg/*.gem

  # ------------------------------------------------------------------ #
  # Build the plain source gem (fallback for unsupported platforms)     #
  # ------------------------------------------------------------------ #
  source-gem:
    name: Build source gem
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - run: bundle exec rake build

      - uses: actions/upload-artifact@v4
        with:
          name: gem-source
          path: pkg/*.gem

  # ------------------------------------------------------------------ #
  # Publish every gem to RubyGems.org via Trusted Publishing (OIDC)     #
  # on tag pushes only.                                                 #
  # ------------------------------------------------------------------ #
  publish:
    name: Publish gems
    if: startsWith(github.ref, 'refs/tags/')
    needs: [test, native-gems, native-gems-darwin, source-gem]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: gem-*
          path: pkg
          merge-multiple: true

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: false

      - uses: rubygems/configure-rubygems-credentials@v1.0.0

      - name: Push gems
        run: |
          for gem in pkg/*.gem; do
            echo "Pushing $gem"
            output=$(gem push "$gem" 2>&1) && echo "$output" || {
              echo "$output"
              echo "$output" | grep -qF "has already been pushed"
            }
          done
