[package]
name = "amoskeag_native"
version = "0.1.0"
edition = "2021"

[lib]
name = "amoskeag_native"
crate-type = ["cdylib"]

[dependencies]
amoskeag = { git = "https://github.com/durable-oss/amoskeag" }
amoskeag-stdlib-operators = { git = "https://github.com/durable-oss/amoskeag" }
serde_json = "1.0"
magnus = "0.7"

# NOTE: the release profile (lto, opt-level, codegen-units) lives in the
# workspace-root Cargo.toml — Cargo ignores profile tables in member crates.
